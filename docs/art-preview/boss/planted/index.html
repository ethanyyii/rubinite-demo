<!doctype html><meta charset="utf-8"><title>Boss 劍立在地上直接出招</title><style>body{background:#2a282c;color:#e8e2dc;font-family:-apple-system,"PingFang TC",sans-serif;margin:24px}img{image-rendering:pixelated;max-width:100%}figure{margin:0 0 20px}</style><h1>劍立在地上直接出招</h1><p>以前第一張就是扛劍，劍會從地上瞬間跳到肩上；現在劍尖先往前離開地面，直接接上這一招的起手。出招的時間和判定都沒變。</p><h3>王權橫掃、雙斬、三斬</h3><figure><img src="boss_c1_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 24 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>快斬連段（二連、三連）</h3><figure><img src="boss_quick_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 14 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>墜誓下劈（含延遲版）</h3><figure><img src="boss_cleave_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 24 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>灰燼衝擊、雙重衝擊</h3><figure><img src="boss_impact_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 24 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>裁決突刺</h3><figure><img src="boss_thrust_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 12 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>灰燼迴旋</h3><figure><img src="boss_spin_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 16 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure><h3>墜王之躍</h3><figure><img src="boss_leap_planted.gif"><figcaption>劍立在地上站著 → 直接出招（前 12 幀是新畫的起手，之後是這一招本身，到砍到為止）。四個方向：朝下、朝右、朝上、朝左（1 倍）</figcaption></figure>
